[project]
name = "atlas-iqoption"
version = "0.1.0"
description = "FX research pipeline with causal features, purged validation, and optional IQ Option demo integration"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.28,<2",
  "duckdb",
  "pandas",
  "pandera",
  "pyarrow",
  "ta",
  "scikit-learn",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
research = ["lightgbm", "optuna", "histdata"]

[dependency-groups]
dev = ["pytest", "pylint", "lightgbm", "optuna"]

[tool.pytest.ini_options]
# Only the project's own tests; vendor/ contains the vendored iqoptionapi
# clone whose integration tests require a live broker login.
testpaths = ["tests"]
