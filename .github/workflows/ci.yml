name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Run offline tests
        run: uv run --locked python -m pytest -q -ra
      - name: Run public demo
        run: uv run --locked python demo.py
      - name: Run in-memory platform demo
        run: uv run --locked python -m atlas demo
